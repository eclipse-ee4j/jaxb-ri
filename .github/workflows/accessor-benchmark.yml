name: Accessor benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - name: Build JAXB RI and install the runtime for the benchmark
        working-directory: jaxb-ri
        run: mvn -B -pl runtime/impl -am -DskipTests install
      - name: Build accessor benchmark
        working-directory: jaxb-ri/perf-bench/accessor
        run: mvn -B package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
      - name: Run JMH comparison
        working-directory: jaxb-ri/perf-bench/accessor
        run: |
          java -cp "target/classes:$(cat target/classpath.txt)" org.openjdk.jmh.Main \
            'org.glassfish.jaxb.perf.AccessorBenchmark.*' -f 2 -wi 5 -i 8 -w 1s -r 1s \
            -prof gc -rf json -rff target/accessor-results.json | tee target/accessor-results.txt
      - name: Publish comparison in workflow summary
        working-directory: jaxb-ri/perf-bench/accessor
        run: |
          python3 - target/accessor-results.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as result_file:
              results = {row["benchmark"].rsplit(".", 1)[-1]: row["primaryMetric"]["score"]
                         for row in json.load(result_file)}

          pairs = (
              ("Field get", "fieldGetReflection", "fieldGetVarHandle"),
              ("Field set", "fieldSetReflection", "fieldSetVarHandle"),
              ("Property get", "propertyGetReflection", "propertyGetMethodHandle"),
              ("Property set", "propertySetReflection", "propertySetMethodHandle"),
          )

          print("### Accessor JMH results (ops/s)\n")
          print("| Operation | Reflection | Handle | Change |")
          print("|---|---:|---:|---:|")
          for label, baseline, optimized in pairs:
              old = results[baseline]
              new = results[optimized]
              change = (new / old - 1.0) * 100.0
              print(f"| {label} | {old:,.0f} | {new:,.0f} | {change:+.1f}% |")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: accessor-jmh-results
          path: jaxb-ri/perf-bench/accessor/target/accessor-results.*
