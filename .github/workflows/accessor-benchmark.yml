name: JAXB binding benchmark

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: 'Baseline commit (defaults to the parent of the branch head)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Build baseline and pull request JAXB runtimes
        env:
          BASE_OVERRIDE: ${{ github.event.inputs.base }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="$BASE_OVERRIDE"
          if [ -z "$base" ]; then
            if [ -n "$PR_HEAD_SHA" ]; then base="$(git rev-parse "${PR_HEAD_SHA}^")";
            else base="$(git rev-parse HEAD^)"; fi
          fi
          echo "BASE_SHA=$(git rev-parse "$base")" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git worktree add /tmp/jaxb-ri-baseline "$base"
          (cd /tmp/jaxb-ri-baseline/jaxb-ri && mvn -B -pl runtime/impl -am -DskipTests install)
          cp /tmp/jaxb-ri-baseline/jaxb-ri/runtime/impl/target/jaxb-runtime-4.1.0-SNAPSHOT.jar /tmp/jaxb-ri-baseline-runtime.jar
          (cd jaxb-ri && mvn -B -pl runtime/impl -am -DskipTests install)
      - name: Build accessor benchmark
        working-directory: perf-bench/accessor
        run: mvn -B package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run end-to-end JAXB and Jackson JMH comparison
        working-directory: perf-bench/accessor
        run: |
          mkdir -p target/results
          { echo "baseline $BASE_SHA"; echo "head $HEAD_SHA"; java -version 2>&1; nproc; lscpu | grep 'Model name'; } > target/results/environment.txt
          deps="$(cat target/classpath.txt)"
          for round in 1 2; do
            for variant in baseline pull-request; do
              if [ "$variant" = baseline ]; then runtime="/tmp/jaxb-ri-baseline-runtime.jar"; else runtime=""; fi
              runtime_cp=""
              if [ -n "$runtime" ]; then runtime_cp="$runtime:"; fi
              echo "$variant round $round load $(cat /proc/loadavg)" >> target/results/environment.txt
              java -cp "target/classes:${runtime_cp}${deps}" org.openjdk.jmh.Main \
                'org.glassfish.jaxb.perf.EndToEndBenchmark.*' -f 2 -wi 5 -i 8 -w 1s -r 1s \
                -prof gc -jvmArgsAppend "-XX:+UseG1GC -XX:ActiveProcessorCount=2" \
                -rf json -rff "target/results/$variant-$round.json" \
                > "target/results/$variant-$round.txt" 2>&1
            done
          done
      - name: Publish comparison in workflow summary
        working-directory: perf-bench/accessor
        run: |
          python3 - target/results >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import glob
          import os
          import sys

          data = {}
          for path in glob.glob(os.path.join(sys.argv[1], "*.json")):
              variant, round_number = os.path.basename(path).removesuffix(".json").rsplit("-", 1)
              for row in json.load(open(path, encoding="utf-8")):
                  method = row["benchmark"].rsplit(".", 1)[-1]
                  operation = "marshal" if method.startswith("marshal") else "unmarshal"
                  strategy = method.removeprefix(operation).lower()
                  books = int(row["params"]["books"])
                  primary = row["primaryMetric"]
                  secondary = row.get("secondaryMetrics", {})
                  alloc = secondary.get("gc.alloc.rate.norm", secondary.get("·gc.alloc.rate.norm", {}))
                  data[(variant, round_number, operation, books, strategy)] = (primary["score"], primary.get("scoreError", 0), alloc.get("score", float("nan")))

          def values(variant, operation, books, strategy, metric):
              return [data[(variant, round_number, operation, books, strategy)][metric]
                      for round_number in ("1", "2")]

          def mean(variant, operation, books, strategy, metric):
              samples = values(variant, operation, books, strategy, metric)
              return sum(samples) / len(samples)

          def cell(variant, operation, books, strategy):
              return " / ".join(f"{score:,.0f} ± {error:,.0f}" for score, error in
                                (data[(variant, r, operation, books, strategy)][:2] for r in ("1", "2")))

          print("## JAXB end-to-end performance (JDK 25, JMH, ops/s; allocation in B/op)\n")
          print(f"Baseline `{os.environ['BASE_SHA'][:10]}` vs PR `{os.environ['HEAD_SHA'][:10]}`; same 4/32/256-book graph, two alternating rounds, 2 forks, 5x1s warmup, 8x1s measurement, G1, 2 active processors, GC profiler.\n")
          print("| Operation | Books | JAXB baseline | JAXB PR | Δ vs baseline | Jackson | PR vs Jackson | PR B/op | Jackson B/op |")
          print("|---|---:|---:|---:|---:|---:|---:|---:|---:|")
          for operation in ("marshal", "unmarshal"):
              for books in (4, 32, 256):
                  base = mean("baseline", operation, books, "handles", 0)
                  pr = mean("pull-request", operation, books, "handles", 0)
                  jackson = mean("pull-request", operation, books, "jackson", 0)
                  print(f"| {operation} | {books} | {cell('baseline', operation, books, 'handles')} | {cell('pull-request', operation, books, 'handles')} | {(pr/base-1)*100:+.1f}% | {cell('pull-request', operation, books, 'jackson')} | {(pr/jackson-1)*100:+.1f}% | {mean('pull-request', operation, books, 'handles', 2):,.0f} | {mean('pull-request', operation, books, 'jackson', 2):,.0f} |")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: jaxb-end-to-end-jmh-results
          path: perf-bench/accessor/target/results/*
